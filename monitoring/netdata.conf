# Netdata for the Mac mini: only on loopback, published to the tailnet with
# Tailscale Serve (docs/MONITORING.md). Copy to /opt/homebrew/etc/netdata/.
[global]
    # Replaced with your macOS account by the install step (docs/MONITORING.md).
    run as user = __USER__
    update every = 1
[web]
    bind to = 127.0.0.1:19999
    allow connections from = localhost 127.0.0.1 ::1
    allow dashboard from = localhost 127.0.0.1 ::1
    allow netdata.conf from = localhost 127.0.0.1 ::1
[statsd]
    enabled = no
# powermetrics needs root and the service runs as the user.
[plugin:macos]
    powermetrics = no
